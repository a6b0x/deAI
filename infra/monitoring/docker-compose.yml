services:
  prometheus:
    # Prometheus 负责采集指标并执行告警规则。
    image: prom/prometheus:v3.5.0
    container_name: infra-prometheus
    restart: unless-stopped
    command:
      # 主配置、数据目录和热加载能力都在这里声明。
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      # 监控配置文件跟 compose 同目录，便于整体迁移。
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus

  grafana:
    # Grafana 负责展示 Prometheus 指标和后续 dashboard。
    image: grafana/grafana:12.1.1
    container_name: infra-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin123456}"
      # 正确的 root_url，避免在反向代理后 URL 生成错误
      GF_SERVER_ROOT_URL: "${GF_SERVER_ROOT_URL:-http://localhost:3000/}"
      GF_SERVER_DOMAIN: "${GF_SERVER_DOMAIN:-localhost}"
      GF_SERVER_ENFORCE_DOMAIN: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      # 启动时自动注入 Prometheus 数据源。
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro

  node-exporter:
    # 采集宿主机 CPU、内存、磁盘等系统指标。
    image: prom/node-exporter:v1.9.1
    container_name: infra-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - "/:/host:ro,rslave"

  cadvisor:
    # 采集 Docker 容器级别的 CPU、内存、文件系统指标。
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: infra-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "${CADVISOR_PORT:-8082}:8080"
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker:/var/lib/docker:ro"
      - "/dev/disk:/dev/disk:ro"

  dcgm-exporter:
    # 采集 NVIDIA GPU 温度、显存和利用率指标。
    # 使用 Docker Hub 公共镜像，避免 nvcr.io 在未登录场景下返回 403。
    image: nvidia/dcgm-exporter:4.4.1-4.6.0-ubuntu22.04
    container_name: infra-dcgm-exporter
    restart: unless-stopped
    ports:
      - "${DCGM_EXPORTER_PORT:-9400}:9400"
    deploy:
      resources:
        reservations:
          devices:
            # 允许 exporter 读取全部 GPU 指标。
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  # Prometheus 时序数据库卷。
  prometheus_data:
  # Grafana 数据卷，保存账号、数据源和 dashboard。
  grafana_data:
