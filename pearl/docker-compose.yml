# Pearl 双矿工 — 双模式配置（--profile 切换）
#
#   docker compose --profile peak  up -d   # 启动 PeakMiner（双卡单进程）
#   docker compose --profile forge up -d   # 启动 ForgeMiner（双卡单进程）
#   docker compose down && ... up -d       # 切换：须先 down，否则两种模式并存端口冲突
#
# 说明：
# - 两矿工均单进程双卡：Peak 用 -d 0,1；Forge 用 --gpu 0,1（注意不是 --devices）
# - worker 用 peak/forge 区分，矿池后台按 worker 合并统计双卡
# - API：Peak 4068；Forge 7777（均只绑本机 127.0.0.1）
# - ⚠ vLLM 占双卡各 ~19.3GB 时剩余 4.26GB 只够 Peak(1.4GB)；跑 Forge(9.2GB/卡)须先停 vllm
# - 细节与根因见 docs/note.md、docs/ref.md

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"        # 矿工日志高频写入，限制大小防吃满磁盘
    max-file: "3"

# host 网络：挖矿长连接免 NAT 开销，API 直连宿主机端口；
# 显式 DNS：防宿主机 DNS 解析矿池域名失败；restart: 崩溃/重启后自动拉起
x-peak-common: &peak-common
  image: peakminer/peakminer:2.11.0
  restart: unless-stopped
  network_mode: host
  dns: [8.8.8.8, 1.1.1.1]
  logging: *default-logging

# forge 的 command 含管道(2>&1 | tee)，须 shell 执行，故 entrypoint 改 /bin/sh -c；
# init: 回收管道子进程，防僵尸堆积
x-forge-common: &forge-common
  image: hashraptor/forge:latest
  restart: unless-stopped
  network_mode: host
  dns: [8.8.8.8, 1.1.1.1]
  logging: *default-logging
  init: true
  entrypoint: ["/bin/sh", "-c"]

# 双卡绑定：deploy.resources + device_ids 精确指定 GPU 0、1
x-gpu-all: &gpu-all
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["0", "1"]
            capabilities: [gpu]

services:
  # ===== 模式 peak：PeakMiner =====
  peakminer:
    <<: [*peak-common, *gpu-all]     # 合并公共锚点，此处只写自身独有配置
    container_name: kryptex-prl-peakminer
    profiles: ["peak"]
    volumes:
      - ./logs/peak:/var/log/peakminer   # 挂出日志，容器重建不丢
    # 数组写法：镜像 entrypoint 即 peakminer 二进制，参数逐个直传，无 shell 转义
    # 参数含义见 ref.md；-d 0,1 选双卡；-u 钱包/worker 用 peak 合并统计
    command:
      - --coin
      - pearl
      - -o
      - stratum+ssl://prl.kryptex.network:8048
      - -u
      - prl1pldsjzegmcujgsp5rlhslp4gyg6zvkcqq2czmpqrptezay0pcmd8sveydvl/peak
      - -d
      - "0,1"
      - -f
      - /var/log/peakminer/miner.log
      - --log-append
      - --api-port
      - "4068"
      - --report-stats

  # ===== 模式 forge：ForgeMiner =====
  forgeminer:
    <<: [*forge-common, *gpu-all]
    container_name: kryptex-prl-forgeminer
    profiles: ["forge"]
    volumes:
      - ./logs/forge:/var/log/forge
    # 字符串写法：带管道须 shell 执行（配合上方 entrypoint）；
    # --gpu 0,1 选双卡；--api-bind 只绑本机；| tee 边显示边落盘
    command:
      - /opt/forge/entrypoint.sh --algorithm pearlhash --pool ssl://prl.kryptex.network:8048 --wallet prl1pldsjzegmcujgsp5rlhslp4gyg6zvkcqq2czmpqrptezay0pcmd8sveydvl --worker forge --gpu 0,1 --api-bind 127.0.0.1:7777 2>&1 | tee -a /var/log/forge/forge.log
