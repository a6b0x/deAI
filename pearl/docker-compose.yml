# Pearl (PRL) 双矿工对比（第二轮交叉验证）：GPU 1 跑 PeakMiner，GPU 0 跑 ForgeMiner。
# 两者均为 PPS+ 模式、同一钱包、同一全球节点，矿池后台按 worker（peak/forge）分别统计。
# 用法：docker compose up -d | down | logs -f peakminer
#
# 日志说明：
#   - PeakMiner 通过 -f 写文件日志到 ./logs/miner.log（同时也有 stdout）
#   - ForgeMiner 不支持写日志文件，用 tee 包装 stdout 落盘到 ./logs/forge.log
#   - 两者 stdout 均落 docker json-file，下方 logging 配置做了轮转（10MB x 3）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  peakminer:
    image: peakminer/peakminer:latest
    container_name: kryptex-prl-peakminer
    restart: unless-stopped
    # host 网络：PeakMiner API 硬编码绑定 127.0.0.1，bridge 下 -p 无法转发。
    network_mode: host
    # 显式外部 DNS，避免容器内矿池域名解析超时（见 note.md 问题记录）。
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./logs:/var/log/peakminer
    logging: *default-logging
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    # 折叠块标量：与 docker run 命令行写法一致
    command: >
      --coin pearl
      -o stratum+ssl://prl.kryptex.network:8048
      -u prl1pldsjzegmcujgsp5rlhslp4gyg6zvkcqq2czmpqrptezay0pcmd8sveydvl/peak
      -f /var/log/peakminer/miner.log
      --log-append
      --api-port 4068
      --report-stats

  forgeminer:
    image: hashraptor/forge:latest
    container_name: kryptex-prl-forgeminer
    restart: unless-stopped
    # host 网络与 PeakMiner 保持一致；--api 仅监听 127.0.0.1:7777。
    network_mode: host
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging: *default-logging
    volumes:
      - ./logs:/var/log/forge
    # init: 由 tini 担任 PID 1，docker stop 的 SIGTERM 能透传到管道两端的 forge 和 tee。
    init: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    # ForgeMiner 无日志文件参数，用 tee 把 stdout 同时写入文件。
    # 注意：command 必须是单元素列表——字符串形式会被 compose 按空格拆分，
    # 导致 sh -c 只执行第一个词、其余变成位置参数。
    # 2026-08-14 故障修复：矿池明文端口 7048 已失效（重连时要求 TLS 但握手 EOF，
    # forge 死循环 TLS connect failed），改用已验证正常的 SSL 端口 8048（与 PeakMiner 同端口）。
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "/opt/forge/entrypoint.sh --algorithm pearlhash --pool ssl://prl.kryptex.network:8048 --wallet prl1pldsjzegmcujgsp5rlhslp4gyg6zvkcqq2czmpqrptezay0pcmd8sveydvl --worker forge --api 2>&1 | tee -a /var/log/forge/forge.log"
