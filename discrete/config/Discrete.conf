# Discrete daemon configuration file
# Format: each line is <NAME><SPACE><VALUE>  (NO leading --, NO equals sign)
# Match command-line arguments: discreted --help

# ==== P2P (peer-to-peer) ====
# Open on firewall/NAT for accepting inbound peers
p2p-bind-ip 0.0.0.0
p2p-bind-port 9330

# If router maps a different public port to local 9330:
# p2p-external-port 19330

# Don't advertise as connectable peer candidate:
# hide-my-port 1

# Manual seed/priority nodes (use if default seeds are unreachable):
# add-priority-node seed-node-1.example.org:9330
# add-seed-node seed-node-2.example.org:9330

# ==== RPC (loopback-only default; NEVER expose 9331 to the Internet) ====
rpc-bind-ip 127.0.0.1
rpc-bind-port 9331

# RPC authentication (enable when RPC is opened beyond loopback):
# rpc-user discreteuser
# rpc-password REPLACE_WITH_STRONG_RPC_PASSWORD

# Disable mutating admin methods on a public-facing RPC:
# restricted-rpc 1

# HTTPS RPC (optional); ensure the HTTP 9331 listener is loopback only:
# rpc-bind-ssl-enable 1
# rpc-bind-ssl-port 9332
# rpc-chain-file /path/to/fullchain.pem
# rpc-key-file /path/to/privkey.pem

# ==== Logging & data ====
log-level 2
# log-file /root/deAI/discrete/logs/discreted.log

data-dir /root/deAI/discrete/data

# ==== Mining (ALTERNATIVE: pass at CLI via scripts/03-start-mining.sh) ====
# Avoid storing the wallet path/password inside the config if possible;
# use 03-start-mining.sh which injects CLI flags instead.
# mining-wallet /root/deAI/discrete/wallet/miner.wallet
# mining-password-file /root/deAI/discrete/wallet/miner-password.txt
# mining-threads 4
